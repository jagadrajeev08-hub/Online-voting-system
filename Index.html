<!DOCTYPE html>
<html>
<head>
    <title>Online Voting System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 0;
        }

        header {
            background: #172554;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #172554;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .info {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>Online Voting System</h1>
    <p>Secure • Simple • Digital</p>
</header>

<div class="container">

    <h2>Voter Login</h2>

    <input type="text" id="voterId" placeholder="Enter Voter ID">

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>

    <div class="info">
        <p>Welcome to the Online Voting System</p>
    </div>

</div>

<script>
function login() {

    let voterId = document.getElementById("voterId").value;
    let password = document.getElementById("password").value;

    if (voterId === "" || password === "") {
        alert("Please enter Voter ID and Password");
    } 
    else {
        alert("Login successful!");
    }
}
</script>

</body>
</html>
